<ul class="article-list">
  <li>
    <h4 class="meta-title">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </h4>
    <div class="meta-data">
      <span>
			{{ if .Params.categories }}
				[ {{ delimit .Params.categories ", " }} ]
			{{ else }}
				[ {{ .Section }} ]
			{{ end }}
      </span>
      <time class="middot" datetime="{{ .Date.Format (.Site.Params.dateform | default "2006-01-02") }}">
      	{{ .Date.Format (.Site.Params.dateform | default "2006/01/02") }}
      </time>
      {{ with .Params.tags }}
      <span>
      	{{ range . }} #{{.}} {{end}}
      </span>
      {{ end }}
    </div>
  </li>
</ul>
