{{ define "main" }}
  <h2>#{{ .Title }}</h2>
  <hr />
  {{ if eq .Kind "taxonomy" }}
    <ul style="list-style: disclosure-closed">
      {{ range .Data.Terms.Alphabetical }}
        <li>
          <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
          {{ .Count }}
        </li>
      {{ end }}
    </ul>
  {{ else }}
    {{ range .Data.Pages.ByPublishDate }}
      {{ partial "tag" . }}
    {{ end }}
  {{ end }}
{{ end }}
