{{ define "main" }}
	<style>
		.page-title { 
			font-weight: 400; 
		}
	</style>
	{{ partial "header" . }}
	<div class="content">
		<div class="page">
			<h1 class="page-title">{{ .Title }}</h1>
			<div class="markdown">
				{{ .Content }}
			</div>
			{{ partial "footer" . }}
		</div>
	</div>
{{ end }}
