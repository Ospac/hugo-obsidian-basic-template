baseURL: "/"
locale: ko-KR
title: "basic"
author: ksh

enableEmoji: true
hasCJKLanguage: false
pygmentsstyle: "tango"
pygmentscodefences: true
markup:
  goldmark:
    renderer:
      unsafe: true
menu:
  primary:
    - name: Home
      url: /
      weight: 1
    - name: About
      url: /about
      weight: 2
    - name: Subscribe
      url: /index.xml
      weight: 3

# You can add languages!
# https://gohugo.io/content-management/multilingual/
defaultContentLanguage: ko
languages:
  ko:
    label: Korean
    # contentDir: content/blog/ko
  en:
    label: English
    # contentDir: content/blog/en

params:
  sitename: "basic theme"
  copyrights: 홍길동

  # path to the favicon directory
  # see ./layouts/_default/baseof.html line #30 to line #37
  #  faviconpath: "/img/favicon"

  # a brief about me
  brief_about: <center>hey world!</center>

  # 아래는 설정하지 않아도 되지만, 템플릿이 알아서 사용하는 선택 항목입니다.

  # 트위터(X) 계정 (@ 없이). 설정하면 트위터 카드 메타태그에 사용됩니다.
  #  twitter: "your_twitter_handle"

  # 글에 설명(description)이 없을 때 대신 쓰이는 기본 사이트 설명.
  #  description: "사이트 한 줄 소개"

  # 글에 대표 이미지(meta_img)가 없을 때 대신 쓰이는 기본 로고/이미지 경로.
  #  logofile: "/img/logo.png"

  # 글 목록/상세에서 날짜를 표시하는 형식 (Go 날짜 포맷). 기본값은 2006-01-02.
  #  dateform: "2006-01-02"

  # 홈 화면의 "더 보기" 링크가 가리키는 경로. 기본값은 blog.
  #  archive: "blog"

  # 홈 화면에 보여줄 글 개수 (globallist 파셜). 설정하지 않으면 전체가 표시됩니다.
  #  paginationLen: 5

  # 글 상세 페이지에 이전/다음 글 이동 링크를 표시할지 여부.
  #  posts_navigation: true

module:
  hugoVersion:
    min: "0.120.0"
